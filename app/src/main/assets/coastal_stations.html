<body>
    <div id="map">
        <div id="live-video-panel"
            style="position: absolute; bottom: 20px; left: 20px; z-index: 1000; display: flex; flex-direction: column; gap: 10px; max-height: 90vh; overflow-y: auto; pointer-events: none;">
        </div>
    </div>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        window.activeCameras = window.activeCameras || {};
        let socket;
        const peers = {};
        const config = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
        const videoPanel = document.getElementById('live-video-panel');
        socket = io('https://webrtc-signaling-mbx6.onrender.com');
        socket.emit('join', 'admin');
        socket.on('signal', async (data) => {
            const senderId = data.from;
            const vesselName = data.senderName || data.shipName || "Unknown Vessel";
            if (data.signal.type === 'disconnect') {
                if (peers[senderId]) {
                    peers[senderId].close();
                    delete peers[senderId];
                }
                const videoWrapper = document.getElementById(`wrapper-${senderId}`);
                if (videoWrapper) videoWrapper.remove();
                for (let key in window.activeCameras) {
                    if (window.activeCameras[key] === senderId) delete window.activeCameras[key];
                }
                return;
            }
            if (!peers[senderId]) {
                peers[senderId] = new RTCPeerConnection(config);
                window.activeCameras[String(senderId)] = senderId;
                if (data.shipName) window.activeCameras[String(data.shipName)] = senderId;
                if (data.shipNumber) window.activeCameras[String(data.shipNumber)] = senderId;
                if (vesselName) window.activeCameras[String(vesselName)] = senderId;
                const wrapper = document.createElement('div');
                wrapper.id = `wrapper-${senderId}`;
                wrapper.style.cssText = 'display: none; background: rgba(0,0,0,0.85); border: 2px solid #28a745; border-radius: 6px; overflow: hidden; width: 260px; pointer-events: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.5);';
                const title = document.createElement('div');
                title.innerHTML = `🔴 Live: ${vesselName} <button onclick="window.closePiP()" style="float: right; background: none; border: none; color: #ff4444; cursor: pointer; font-weight: bold;">X</button>`;
                title.style.cssText = 'color: white; padding: 6px; font-size: 13px; font-weight: bold; background: #222; border-bottom: 1px solid #444;';
                const newVideo = document.createElement('video');
                newVideo.id = `video-${senderId}`;
                newVideo.autoplay = true;
                newVideo.playsInline = true;
                newVideo.muted = true;
                newVideo.style.cssText = 'width: 100%; display: block; background: #000; min-height: 140px;';
                const audioBtn = document.createElement('button');
                audioBtn.innerText = "🔇 Audio is Muted (Click to Unmute)";
                audioBtn.style.cssText = 'width: 100%; padding: 6px; background: #333; color: #fff; border: none; cursor: pointer; font-size: 12px;';
                audioBtn.onclick = () => {
                    newVideo.muted = !newVideo.muted;
                    audioBtn.innerText = newVideo.muted ? "🔇 Audio is Muted" : "🔊 Audio Playing";
                    audioBtn.style.background = newVideo.muted ? "#333" : "#28a745";
                };
                wrapper.appendChild(title);
                wrapper.appendChild(newVideo);
                wrapper.appendChild(audioBtn);
                videoPanel.appendChild(wrapper);
                peers[senderId].ontrack = (event) => {
                    newVideo.srcObject = event.streams[0];
                };
                peers[senderId].onicecandidate = (event) => {
                    if (event.candidate) {
                        socket.emit('signal', { to: senderId, signal: event.candidate });
                    }
                };
            }
            const pc = peers[senderId];
            try {
                if (data.signal.type === 'offer') {
                    await pc.setRemoteDescription(data.signal);
                    const answer = await pc.createAnswer();
                    await pc.setLocalDescription(answer);
                    socket.emit('signal', { to: senderId, signal: answer });
                } else if (data.signal.candidate) {
                    await pc.addIceCandidate(data.signal);
                }
            } catch (e) {
                console.error("WebRTC Error:", e);
            }
        });
        window.activatePiPMode = function (vesselName, senderId) {
            const allWrappers = videoPanel.querySelectorAll('div[id^="wrapper-"]');
            allWrappers.forEach(w => w.style.display = 'none');
            const targetWrapper = document.getElementById(`wrapper-${senderId}`);
            if (targetWrapper) {
                targetWrapper.style.display = 'block';
            }
        };
        window.closePiP = function () {
            const allWrappers = videoPanel.querySelectorAll('div[id^="wrapper-"]');
            allWrappers.forEach(w => w.style.display = 'none');
        };
    </script>

        function calculateLineDistanceNM(linePoints) {

                let p2 = L.latLng(linePoints[i + 1].lat || linePoints[i + 1][0], linePoints[i + 1].lng || linePoints[i + 1][1]);

            <meta charset="utf-8">
            <title></title>
            <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
            <link rel="stylesheet" href="https://ppete2.github.io/Leaflet.PolylineMeasure/Leaflet.PolylineMeasure.css" />
            <style>
            body { font-family: Futura Lt BT, Prompt, sans-serif; font-size: 14px; }
            #map { height: 380px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; }
            .muted { border: 1px solid #ddd; font-size: 14px; }
            table { width: 100%; font-size: 14px; }
            @media print {
            body { padding: 0; }
            @page { size: A4 landscape; margin: 10mm; }
            .leaflet-control-container { display: none !important; }
            }
            </style>
            </head>
            <body>
            <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 5px; margin-left: 5px;">
            <div style="font-size: 18px; font-weight: 600;">ภารกิจ ${missionName}</div>
            </div><hr style="margin-bottom: 5px;">
            <table class="header-table">
            <tr>
            <td width="60%" style="text-align:left;">ตั้งแต่ วันที่ ${startDate} เวลา ${startTime} ถึง วันที่ ${endDate} เวลา ${endTime}</td>
            <td width="40%" style="text-align:right;">${Name}</td>
            </tr>
            <tr>
            <td width="60%" style="text-align:left;">ประมาณการปริมาณน้ำมันเชื้อเพลิงที่ใช้การ จำนวน ${totalFuel} ลิตร | ระยะทางรวม ${finalDistance.toFixed(2)} ไมล์ทะเล</td>
            <td width="40%" style="text-align:right;">อัตราการสิ้นเปลืองน้ำมันเชื้อเพลิง ${cruisingConsumption} ลิตร/ชั่วโมง</td>
            </tr>
            </table>
            <div id="map"></div>
            ${dynamicTablesHtml}
            <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"><\/script>
            <script src="https://ppete2.github.io/Leaflet.PolylineMeasure/Leaflet.PolylineMeasure.js"><\/script>
            <script>
            const map = L.map('map', { zoomControl: false }).setView([13.0, 100.0], 8); 
            L.tileLayer('https://mt{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', { subdomains: '0123' }).addTo(map);
            const lineCoordinates = ${JSON.stringify(routeLines)};
            if (lineCoordinates && lineCoordinates.length > 0) {
            const measureControl = L.control.polylineMeasure({
            position: 'topleft',
            unit: 'nauticalmiles',
            showBearings: true,
            showMeasurementsClearControl: false,
            clearMeasurementsOnStop: false,
            showUnitControl: false,
            tempLine: {color: '#00539C', weight: 2}, 
            fixedLine: {color: '#006E51', weight: 2}
            }).addTo(map);
            measureControl.seed(lineCoordinates);
            const bounds = L.latLngBounds();
            lineCoordinates.forEach(line => {
            line.forEach(coord => {
            bounds.extend(coord);
            });
            });
            map.fitBounds(bounds, { padding: [40, 40] });
            }
            map.on('load', function() {
            setTimeout(() => { window.print(); }, 1200);
            });
            // Fallback
            setTimeout(() => { window.print(); }, 2000);
            <\/script>
            </body>
            </html>`;
            printWindow.document.open();
            printWindow.document.write(htmlContent);
            printWindow.document.close();
        }
        function handleMapZoom() {
            var currentZoom = map.getZoom();
            if (typeof SeaLevelContourGroup !== 'undefined' && map.hasLayer(SeaLevelContourGroup)) {
                var newStyle = getDynamicContourStyle(currentZoom);
                SeaLevelContourGroup.eachLayer(function (layer) {
                    if (layer.setStyle) {
                        layer.setStyle({
                            weight: newStyle.weight,
                            opacity: newStyle.opacity
                        });
                    }
                });
            }
            var isZoomedOut = currentZoom <= 8;
            var iconSize = currentZoom >= 15 ? 25 : (currentZoom >= 8 ? 14 : 11);
            var mapContainer = map.getContainer();
            mapContainer.style.setProperty('--boat-size', iconSize + 'px');
            if (currentZoom >= 12) {
                mapContainer.classList.add('show-map-tooltips');
            } else {
                mapContainer.classList.remove('show-map-tooltips');
            }
        }
        map.on('zoomend', handleMapZoom);
        handleMapZoom();
        map.on('overlayadd', function (eventLayer) {
            if (eventLayer.name === 'กระแสน้ำ') {
                CurrentsLegend.addTo(map);
            }
            if (eventLayer.name === 'ระดับน้ำทะเล') {
                DepthLegend.addTo(map);
            }
        });
        map.on('overlayremove', function (eventLayer) {
            if (eventLayer.name === 'กระแสน้ำ') {
                map.removeControl(CurrentsLegend);
            }
            if (eventLayer.name === 'ระดับน้ำทะเล') {
                map.removeControl(DepthLegend);
            }
        });
        setTimeout(function () {
            if (typeof SeaLevelContourGroup !== 'undefined' && map.hasLayer(SeaLevelContourGroup)) {
                if (typeof DepthLegend !== 'undefined') {
                    DepthLegend.addTo(map);
                }
            }
            if (typeof allCoastalCurrentsLayer !== 'undefined' && map.hasLayer(allCoastalCurrentsLayer)) {
                if (typeof CurrentsLegend !== 'undefined') {
                    CurrentsLegend.addTo(map);
                }
            }
        }, 500);
        $(document).ready(function () {
            const initialCenter = map.getCenter();
            loadData(initialCenter.lat, initialCenter.lng);
            map.on('moveend', function () {
                const newCenter = map.getCenter();
                loadData(newCenter.lat, newCenter.lng);
            });
            const slider = document.getElementById('ui-hourly-container');
            let isDown = false; let startX; let scrollLeft;
            const panels = document.querySelectorAll('.info-panel, .layer-panel, .search-panel, .create-panel');
            panels.forEach(panel => {
                panel.addEventListener('click', function (event) {
                    const clickedItem = event.target.closest('a, button');
                    if (clickedItem) {
                        if (clickedItem.classList.contains('keep-open')) {
                            return; // Do nothing, let the button do its normal job
                        }
                        closeAllPanels();
                    }
                });
            });
        });
    </script>
</body>

</html>
