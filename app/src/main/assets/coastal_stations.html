            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.85) 0%, rgba(255, 255, 255, 0.4) 60%, transparent 100%);

            pointer-events: none;
        }

        .cd-tile {
            background: #111;
            border-radius: 8px;
            overflow: hidden;
            display: block;
            border: 2px solid #333;
            position: relative;
            pointer-events: auto;
        }

        .cd-tile-name {
            position: absolute;
            top: 12px;

            color: #111;
            font-family: Arial, sans-serif;
            font-size: 14px;
            font-weight: bold;
            /* ปิด text-shadow ไว้เพราะมีแถบสีขาวรองรับแล้ว */
            /* text-shadow: -1px -1px 0 #FFFFFF,
                1px -1px 0 #FFFFFF,
                -1px 1px 0 #FFFFFF,
                1px 1px 0 #FFFFFF,
                0px -1px 0 #FFFFFF,
                0px 1px 0 #FFFFFF,
                -1px 0px 0 #FFFFFF,
                1px 0px 0 #FFFFFF;
            */
            z-index: 1000;
            pointer-events: none;
        }

        .cd-tile-close {
            position: absolute;
            top: 10px;
            right: 15px;
            color: #ff3333;
            background: none;
            border: none;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            z-index: 1000;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
            padding: 0;
        }

        .cd-tile-mute {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);

            align-items: center;

            cursor: pointer;
            z-index: 1000;
            font-size: 16px;
            padding: 0;
            line-height: 1;

    <script>
        function clearAllActiveIcons() {
            const activeIcons = document.querySelectorAll('.custom-open-btn span.active');
            activeIcons.forEach(function (icon) {
                icon.classList.remove('active');
            });
            if (typeof polylineMeasure !== 'undefined' && polylineMeasure._measuring) { polylineMeasure._toggleMeasure(); }
        }
        function toggleInfoPanel() {
            const infoPanel = document.querySelector('.info-panel');
            const wasActive = infoPanel && infoPanel.classList.contains('active');
            closeAllPanels();
            if (infoPanel && !wasActive) {
                infoPanel.classList.add('active');
            } else if (wasActive) {
                clearAllActiveIcons(); // ยกเลิกสถานะปุ่มเมื่อปิด
            }
        }
        function toggleLayerPanel() {
            const layerPanel = document.querySelector('.layer-panel');
            const wasActive = layerPanel && layerPanel.classList.contains('active');
            closeAllPanels();
            if (layerPanel && !wasActive) {
                layerPanel.classList.add('active');
            } else if (wasActive) {
                clearAllActiveIcons(); // ยกเลิกสถานะปุ่มเมื่อปิด
            }
        }
        function toggleSearchPanel() {
            const searchPanel = document.querySelector('.search-panel');
            const wasActive = searchPanel && searchPanel.classList.contains('active');
            closeAllPanels();
            if (searchPanel && !wasActive) {
                window.activeGroupView = null;
                searchPanel.classList.add('active');

            } else if (wasActive) {
                clearAllActiveIcons(); // ยกเลิกสถานะปุ่มเมื่อปิด
            }
        }
        function toggleCreatePanel() {
            const createPanel = document.querySelector('.create-panel');
            const wasActive = createPanel && createPanel.classList.contains('active');
            closeAllPanels();
            if (createPanel && !wasActive) {
                createPanel.classList.add('active');
            }
        }
        function toggleCreateDisplay() {
            const createDisplay = document.querySelector('.create-display');
            const wasActive = createDisplay && createDisplay.classList.contains('active');
            closeAllPanels();
            if (createDisplay && !wasActive) {
                createDisplay.classList.add('active');
            }
        }
        function toggleCreateDashboard() {
            const createDashboard = document.querySelector('.create-dashboard');
            const wasActive = createDashboard && createDashboard.classList.contains('active');
            closeAllPanels();
            if (createDashboard && !wasActive) {
                createDashboard.classList.add('active');
            } else if (wasActive) {
                const layerPanel = document.querySelector('.layer-panel');
                if (layerPanel) {
                    layerPanel.classList.add('active');
                }
            }
        }
        function toggleCreateGroupView() {
            const createGroupView = document.querySelector('.create-groupView');
            const wasActive = createGroupView && createGroupView.classList.contains('active');
            closeAllPanels();
            if (createGroupView && !wasActive) {
                createGroupView.classList.add('active');
            } else if (wasActive) {
                window.activeGroupView = null;
                toggleSearchPanel();
            }
        }
        function closeAllPanels() {
            const infoPanel = document.querySelector('.info-panel');
            const layerPanel = document.querySelector('.layer-panel');
            const searchPanel = document.querySelector('.search-panel');
            const createPanel = document.querySelector('.create-panel');
            const createDisplay = document.querySelector('.create-display');
            const createDashboard = document.querySelector('.create-dashboard');
            const createGroupView = document.querySelector('.create-groupView');
            const overlay = document.querySelector('.overlay');
            if (infoPanel) infoPanel.classList.remove('active');
            if (layerPanel) layerPanel.classList.remove('active');
            if (searchPanel) searchPanel.classList.remove('active');
            if (createPanel) createPanel.classList.remove('active');
            if (createDashboard) createDashboard.classList.remove('active');
            if (createGroupView) createGroupView.classList.remove('active');
            if (overlay) overlay.classList.remove('active');
            if (typeof groupUpdateInterval !== 'undefined' && groupUpdateInterval) {
                clearInterval(groupUpdateInterval);
                groupUpdateInterval = null;
            }
        }
    </script>

                        OfflineHelper.getWeatherData(window.currentOfflineReportId).then(data => {
                            if (data && typeof renderData === 'function') {
                                if (data.points && data.points.length > 0) {
                                    let closest = data.points[0];
                                    let minDist = Infinity;
                                    function haversineDist(lat1, lon1, lat2, lon2) {
                                        const R = 6371;
                                        const dLat = (lat2 - lat1) * Math.PI / 180;
                                        const dLon = (lon2 - lon1) * Math.PI / 180;
                                        const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                                            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                                            Math.sin(dLon / 2) * Math.sin(dLon / 2);
                                        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
                                        return R * c;
                                    }
                                    for (let i = 0; i < data.points.length; i++) {
                                        let pt = data.points[i];
                                        let dist = haversineDist(lat, lng, pt.lat, pt.lng);

                    dateInput.value = localDate;

                    if (lat && lng) loadData(lat, lng);
                    dateInput.addEventListener('change', () => {

                        const currentLng = document.getElementById('longitude').value;
                        if (currentLat && currentLng) loadData(currentLat, currentLng);
                    });
                    const slider = document.getElementById('ui-hourly-container');
                    let isDown = false; let startX; let scrollLeft;
                    slider.addEventListener('mousedown', (e) => {
                        isDown = true; slider.style.cursor = 'grabbing';
                        startX = e.pageX - slider.offsetLeft; scrollLeft = slider.scrollLeft;
                    });
                    slider.addEventListener('mouseleave', () => { isDown = false; slider.style.cursor = 'grab'; });
                    slider.addEventListener('mouseup', () => { isDown = false; slider.style.cursor = 'grab'; });
                    slider.addEventListener('mousemove', (e) => {
                        if (!isDown) return;
                        e.preventDefault();
                        const x = e.pageX - slider.offsetLeft;
                        const walk = (x - startX) * 1.5;
                        slider.scrollLeft = scrollLeft - walk;
                    });
                });

                const existingPc = peers[receiverId];
                if (existingPc && existingPc.iceConnectionState !== 'closed' && existingPc.iceConnectionState !== 'failed') {
                    try {
                        broadcastStream.getTracks().forEach(track => {

                    } catch (e) {
                        console.error('Error merging broadcast into existing connection:', e);

                    } catch (err) {
                        alert('Microphone access denied. Please allow microphone permissions.');
                        return;
                    }
                    isBroadcasting = true;
                    if (window.Android && typeof window.Android.startBroadcast === 'function') {
                        window.Android.startBroadcast();
                    }
                    btn.textContent = 'หยุดประกาศคำสั่ง';
                    btn.style.background = '#dc3545';
                    const peerIds = Object.keys(peers);
                    for (let i = 0; i < peerIds.length; i++) {
                        const senderId = peerIds[i];

                            startBroadcastToPeer(senderId);

                        window.Android.stopBroadcast();
                    }
                    if (broadcastStream) {
                        broadcastStream.getTracks().forEach(t => t.stop());
                        broadcastStream = null;
                    }
                    for (const id of Object.keys(broadcastPeers)) {
                        try { broadcastPeers[id].close(); } catch (e) { }
                        delete broadcastPeers[id];
                    }
                    for (const id of Object.keys(peers)) {
                        const pc = peers[id];
                        if (pc && pc.signalingState !== 'closed') {
                            pc.getSenders().forEach(sender => {

                        }
                    }
                    socket.emit('broadcast', { signal: { type: 'broadcast_stopped' } });
                    btn.textContent = 'เริ่มประกาศคำสั่ง';
                    btn.style.background = '#28a745';
                    showBroadcastBanner(false);

            };
            function showBroadcastBanner(active) {

            }

                function parseThaiTextToISO(text) {
                    const regex = /.*?\s*(\d{1,2})\s*([ก-๙\.]+)\s*(\d{4})\s*เวลา\s*(\d{1,2})[:\.](\d{2})/;
                    const match = text.match(regex);
                    if (match) {
                        let [, day, monthThai, yearThai, hour, minute] = match;
                        monthThai = monthThai.trim();
                        let month = thaiMonthsMap[monthThai];
                        if (!month) return null;
                        let year = parseInt(yearThai, 10) - 543;
                        day = day.padStart(2, '0');
                        hour = hour.padStart(2, '0');
                        return `${year}-${month}-${day}T${hour}:${minute}`;

                    return null;

        function savePolygons() {

            var cruisingConsumption = parseFloat(document.getElementById('consumption').value) || 0;
            var idlingConsumption = cruisingConsumption * 0.05;
            var totalMinutesVal = 0;
            var fuelVal = 0;
            var timeVal = "";
            var listHTML = "";
            var itinerary = [];
            var missionData = extractMissionDataFromMessages();
            var overallStart = null;
            var overallEnd = null;
            let drawnLineIndex = 0;
            let mapLines = typeof currentSessionLines !== 'undefined' ? currentSessionLines : [];
            if (missionData && missionData.length > 0) {
                for (let i = 0; i < missionData.length; i++) {
                    if (missionData[i].departureTime || missionData[i].arrivalTime) {
                        overallStart = missionData[i].departureTime || missionData[i].arrivalTime;
                        break;
                    }
                }
                for (let i = missionData.length - 1; i >= 0; i--) {
                    if (missionData[i].arrivalTime || missionData[i].departureTime) {
                        overallEnd = missionData[i].arrivalTime || missionData[i].departureTime;
                        break;
                    }
                }
                missionData.forEach(function (dest, index) {
                    if (index > 0) {
                        var prevDest = missionData[index - 1];
                        if (prevDest.departureTime && dest.arrivalTime) {
                            var depTime = new Date(prevDest.departureTime);
                            var arrTime = new Date(dest.arrivalTime);
                            var travelHours = (arrTime - depTime) / (1000 * 60 * 60);
                            if (travelHours > 0) {
                                totalMinutesVal += travelHours * 60;
                                var travelFuel = travelHours * cruisingConsumption;
                                fuelVal += travelFuel;
                                var legDistance = 0;
                                if (mapLines.length > 0) {
                                    if (mapLines.length === 1 && mapLines[0].length > missionData.length - 1) {
                                        let segment = [mapLines[0][index - 1], mapLines[0][index]];
                                        legDistance = calculateLineDistanceNM(segment);
                                    }
                                    else if (mapLines[drawnLineIndex]) {
                                        legDistance = calculateLineDistanceNM(mapLines[drawnLineIndex]);
                                        drawnLineIndex++;
                                    }
                                }
                                let tDep = formatThaiDateTime(prevDest.departureTime);
                                let tArr = formatThaiDateTime(dest.arrivalTime);
                                itinerary.push({
                                    date: tDep.date,
                                    timeRange: `${tDep.rawTime} น. - ${tArr.rawTime} น.`,
                                    description: `เดินทางจาก ${prevDest.name} ไปยัง ${dest.name}`,
                                    duration: travelHours.toFixed(2),

                                    fuel: travelFuel.toFixed(2)
                                });
                                listHTML += `<li><strong>${tDep.rawTime} น. - ${tArr.rawTime} น.:</strong> เดินทางจาก ${prevDest.name} ไปยัง ${dest.name} (${travelHours.toFixed(2)} ชม. | ระยะทาง ${legDistance.toFixed(2)} ไมล์ทะเล | ${travelFuel.toFixed(2)} ลิตร)</li>`;
                            }
                        }
                    }
                    if (dest.arrivalTime && dest.departureTime) {
                        var arrTime2 = new Date(dest.arrivalTime);
                        var depTime2 = new Date(dest.departureTime);
                        var restHours = (depTime2 - arrTime2) / (1000 * 60 * 60);
                        if (restHours > 0) {
                            totalMinutesVal += restHours * 60;
                            var restFuel = restHours * idlingConsumption;
                            fuelVal += restFuel;
                            let tArr = formatThaiDateTime(dest.arrivalTime);
                            let tDep = formatThaiDateTime(dest.departureTime);
                            itinerary.push({
                                date: tDep.date,
                                timeRange: `${tArr.rawTime} น. - ${tDep.rawTime} น.`,
                                description: `เทียบท่าหรือจอดลอยลำ ${dest.name}`,
                                duration: restHours.toFixed(2),

                            });
                            listHTML += `<li><strong>${tArr.rawTime} น. - ${tDep.rawTime} น.:</strong> เทียบท่าหรือจอดลอยลำ ${dest.name} (${restHours.toFixed(2)} ชม. | ${restFuel.toFixed(2)} ลิตร)</li>`;
                        }
                    }
                });
            }
            if (totalMinutesVal > 0) {
                var totalSeconds = totalMinutesVal * 60;
                var days = Math.floor(totalSeconds / 86400);
                var hours = Math.floor((totalSeconds % 86400) / 3600);
                var minutes = Math.floor((totalSeconds % 3600) / 60);
                var seconds = Math.round(totalSeconds % 60);
                if (days > 0) { timeVal += days + "d "; }
                if (hours > 0 || days > 0) { timeVal += hours + "h "; }
                timeVal += minutes + "m " + seconds + "s";
            }

                endDate: formattedEnd.date,
                endTime: formattedEnd.time,
                itinerary: itinerary,
                details: listHTML,
                lines: mapLines // Saves the map lines drawn
            };
            var savedReports = JSON.parse(localStorage.getItem('savedPolygonReports') || '[]');
            savedReports.push(newReport);
            localStorage.setItem('savedPolygonReports', JSON.stringify(savedReports));
            if (typeof OfflineHelper !== 'undefined') { OfflineHelper.saveMissionData(newReport, mapLines); }

            if (typeof polylineMeasure !== 'undefined' && polylineMeasure.clearAll) { polylineMeasure.clearAll(); }
            document.getElementById('mission').value = "";

                if (msgDiv) msgDiv.innerHTML = '';

            if (typeof displayReports === 'function') {

        function encodeReportData(report) {

        function decodeReportData(base64String) {

                    });
                });
                map.fitBounds(bounds, { padding: [40, 40] });
            }
            setTimeout(() => {
                map.invalidateSize();
                setTimeout(() => {
                    const element = hiddenContainer.querySelector('#report-content');
                    const now = new Date();
                    const yyyy = now.getFullYear();
                    const mm = String(now.getMonth() + 1).padStart(2, '0'); // เดือนเริ่มจาก 0 เลยต้อง +1
                    const dd = String(now.getDate()).padStart(2, '0');
                    const hh = String(now.getHours()).padStart(2, '0');
                    const min = String(now.getMinutes()).padStart(2, '0');
                    const formattedDateTime = `${yyyy}${mm}${dd}${hh}${min}`;
                    const opt = {
                        margin: [0.4, 0.2, 0.4, 0.2],
                        filename: `${formattedDateTime} พิมพ์รายงาน.pdf`,
                        image: {
                            type: 'jpeg',
                            quality: 0.8 // ปรับลดลงจาก 0.98
                        },
                        html2canvas: {
                            scale: 1.5, // หรือปรับเป็น 1 ถ้าต้องการให้เร็วที่สุด
                            useCORS: true,
                            logging: false,
                            letterRendering: true, // ช่วยให้จัดการตัวอักษรได้เร็วและดีขึ้น
                            willReadFrequently: true // บอกเบราว์เซอร์ให้รีดประสิทธิภาพ Canvas ออกมา
                        },
                        jsPDF: { unit: 'in', format: 'a4', orientation: 'landscape' },
                        pagebreak: { mode: 'css', avoid: 'tr' }
                    };
                    html2pdf().set(opt).from(element).save().then(() => {
                        map.remove();
                        document.body.removeChild(hiddenContainer);
                    });
                }, 500);
            }, 2000);
        }
        function handleMapZoom() {
            var currentZoom = map.getZoom();
            if (typeof SeaLevelContourGroup !== 'undefined' && map.hasLayer(SeaLevelContourGroup)) {
                var newStyle = getDynamicContourStyle(currentZoom);
                SeaLevelContourGroup.eachLayer(function (layer) {
                    if (layer.setStyle) {
                        layer.setStyle({
                            weight: newStyle.weight,
                            opacity: newStyle.opacity
                        });
                    }
                });
            }
            var isZoomedOut = currentZoom <= 8;
            var iconSize = currentZoom >= 15 ? 25 : (currentZoom >= 8 ? 14 : 11);
            var mapContainer = map.getContainer();
            mapContainer.style.setProperty('--boat-size', iconSize + 'px');
            if (currentZoom >= 12) {
                mapContainer.classList.add('show-map-tooltips');
            } else {
                mapContainer.classList.remove('show-map-tooltips');
            }
        }
        map.on('zoomend', handleMapZoom);
        handleMapZoom();
        $(document).ready(function () {
            const initialCenter = map.getCenter();
            loadData(initialCenter.lat, initialCenter.lng);
            map.on('moveend', function () {
                const newCenter = map.getCenter();
                loadData(newCenter.lat, newCenter.lng);
            });
            const slider = document.getElementById('ui-hourly-container');
            let isDown = false; let startX; let scrollLeft;
            const panels = document.querySelectorAll('.info-panel, .layer-panel, .search-panel, .create-panel, .create-groupView');
            panels.forEach(panel => {
                panel.addEventListener('click', function (event) {
                    const clickedItem = event.target.closest('a, button');
                    if (clickedItem) {
                        if (clickedItem.classList.contains('keep-open') || clickedItem.classList.contains('close_icon')) {
                            return; // Do nothing, let the button do its normal job
                        }
                        closeAllPanels();
                    }
                });
            });
            $('#toggle-liveBoatCluster').on('change', function () {
                if ($(this).is(':checked')) allSearchableBoats.addLayer(liveBoatCluster);
                else allSearchableBoats.removeLayer(liveBoatCluster);
            });
            $('#toggle-wfsBoatCluster').on('change', function () {
                if ($(this).is(':checked')) allSearchableBoats.addLayer(wfsBoatCluster);
                else allSearchableBoats.removeLayer(wfsBoatCluster);
            });
            $('#toggle-template5').on('change', function () {
                if ($(this).is(':checked')) allSearchableBoats.addLayer(window.template5);
                else allSearchableBoats.removeLayer(window.template5);
            });
            $('#toggle-template6').on('change', function () {
                if ($(this).is(':checked')) allSearchableBoats.addLayer(window.template6);
                else allSearchableBoats.removeLayer(window.template6);
            });
            $('#toggle-template7').on('change', function () {
                if ($(this).is(':checked')) allSearchableBoats.addLayer(window.template7);
                else allSearchableBoats.removeLayer(window.template7);
            });
            function updateGroupCounts() {
                function getMarkerCount(group) {
                    let count = 0;
                    function collect(g) {
                        if (g && g.eachLayer) {
                            g.eachLayer(layer => {
                                if (layer instanceof L.Marker) {
                                    count++;
                                } else if (layer.eachLayer) {
                                    collect(layer);
                                }
                            });
                        }
                    }
                    collect(group);
                    return count;
                }
                const liveCount = getMarkerCount(typeof liveBoatCluster !== 'undefined' ? liveBoatCluster : null);
                const wfsCount = getMarkerCount(typeof wfsBoatCluster !== 'undefined' ? wfsBoatCluster : null);
                const template5Count = getMarkerCount(typeof window.template5 !== 'undefined' ? window.template5 : null);
                const liveEl = document.getElementById('count-liveBoatCluster');
                if (liveEl) liveEl.innerHTML = liveCount;
                const wfsEl = document.getElementById('count-wfsBoatCluster');
                if (wfsEl) wfsEl.innerHTML = wfsCount;
                const temp5El = document.getElementById('count-template5');
                if (temp5El) temp5El.innerHTML = template5Count;
                const template6Count = getMarkerCount(typeof window.template6 !== 'undefined' ? window.template6 : null);
                const temp6El = document.getElementById('count-template6');
                if (temp6El) temp6El.innerHTML = template6Count;
                const template7Count = getMarkerCount(typeof window.template7 !== 'undefined' ? window.template7 : null);
                const temp7El = document.getElementById('count-template7');
                if (temp7El) temp7El.innerHTML = template7Count;
            }
            setInterval(updateGroupCounts, 2000);
            updateGroupCounts();
        });
    </script>

</body>
