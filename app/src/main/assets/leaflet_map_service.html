        function clearAllActiveIcons() {
            const activeIcons = document.querySelectorAll('.custom-open-btn span.active');
            activeIcons.forEach(function (icon) {
                icon.classList.remove('active');
            });
            if (typeof polylineMeasure !== 'undefined' && polylineMeasure._measuring) { polylineMeasure._toggleMeasure(); }
        }
        function toggleInfoPanel() {
            const infoPanel = document.querySelector('.info-panel');
            const wasActive = infoPanel && infoPanel.classList.contains('active');
            closeAllPanels();
            if (infoPanel && !wasActive) {
                infoPanel.classList.add('active');
                const overlay = document.querySelector('.overlay');
                if (overlay) overlay.classList.add('active');
            } else if (wasActive) {
                clearAllActiveIcons(); // ยกเลิกสถานะปุ่มเมื่อปิด
            }
        }
        function toggleLayerPanel() {
            const layerPanel = document.querySelector('.layer-panel');
            const wasActive = layerPanel && layerPanel.classList.contains('active');
            closeAllPanels();
            if (layerPanel && !wasActive) {
                layerPanel.classList.add('active');
                const overlay = document.querySelector('.overlay');
                if (overlay) overlay.classList.add('active');
            } else if (wasActive) {
                clearAllActiveIcons(); // ยกเลิกสถานะปุ่มเมื่อปิด
            }
        }
        function toggleSearchPanel() {
            const searchPanel = document.querySelector('.search-panel');
            const wasActive = searchPanel && searchPanel.classList.contains('active');
            closeAllPanels();
            if (searchPanel && !wasActive) {
                window.activeGroupView = null;
                searchPanel.classList.add('active');
                const overlay = document.querySelector('.overlay');
                if (overlay) overlay.classList.add('active');

            } else if (wasActive) {
                clearAllActiveIcons(); // ยกเลิกสถานะปุ่มเมื่อปิด
            }
        }
        function toggleCreatePanel() {
            const createPanel = document.querySelector('.create-panel');
            const wasActive = createPanel && createPanel.classList.contains('active');
            closeAllPanels();
            if (createPanel && !wasActive) {
                createPanel.classList.add('active');
                const overlay = document.querySelector('.overlay');
                if (overlay) overlay.classList.add('active');
            }
        }
        function toggleCreateMinimap() {
            const createMinimap = document.querySelector('.create-minimap');
            const wasActive = createMinimap && createMinimap.classList.contains('active');
            closeAllPanels();
            if (createMinimap && !wasActive) {
                createMinimap.classList.add('active');
                if (window.miniMapInstance) {
                    setTimeout(() => window.miniMapInstance.invalidateSize(), 300);
                }
            }
        }

        function toggleCreateDashboard() {
            const createDashboard = document.querySelector('.create-dashboard');
            const wasActive = createDashboard && createDashboard.classList.contains('active');
            closeAllPanels();
            if (createDashboard && !wasActive) {
                createDashboard.classList.add('active');
                const overlay = document.querySelector('.overlay');
                if (overlay) overlay.classList.add('active');
            } else if (wasActive) {
                const layerPanel = document.querySelector('.layer-panel');
                if (layerPanel) {
                    layerPanel.classList.add('active');
                }
            }
        }
        function toggleCreateGroupView() {
            const createGroupView = document.querySelector('.create-groupView');
            const wasActive = createGroupView && createGroupView.classList.contains('active');
            closeAllPanels();
            if (createGroupView && !wasActive) {
                createGroupView.classList.add('active');
                const overlay = document.querySelector('.overlay');
                if (overlay) overlay.classList.add('active');
            } else if (wasActive) {
                window.activeGroupView = null;
                toggleSearchPanel();
            }
        }
        function toggleCreateTarget() {
            const createTarget = document.querySelector('.create-target');
            const wasActive = createTarget && createTarget.classList.contains('active');
            closeAllPanels();
            if (createTarget && !wasActive) {
                createTarget.classList.add('active');
                const overlay = document.querySelector('.overlay');
                if (overlay) overlay.classList.add('active');
            } else if (wasActive) {
                window.activeGroupView = null;
                toggleSearchPanel();
            }
        }
        function toggleCreateFollow() {
            const createFollow = document.querySelector('.create-follow');
            const wasActive = createFollow && createFollow.classList.contains('active');
            closeAllPanels();
            if (createFollow && !wasActive) {
                createFollow.classList.add('active');
                const overlay = document.querySelector('.overlay');
                if (overlay) overlay.classList.add('active');
            }
        }
        function closeAllPanels() {
            const infoPanel = document.querySelector('.info-panel');
            const layerPanel = document.querySelector('.layer-panel');
            const searchPanel = document.querySelector('.search-panel');
            const createPanel = document.querySelector('.create-panel');
            const createMinimap = document.querySelector('.create-minimap');
            const createFollow = document.querySelector('.create-follow');
            const createDashboard = document.querySelector('.create-dashboard');
            const createGroupView = document.querySelector('.create-groupView');
            const createTarget = document.querySelector('.create-target');
            const overlay = document.querySelector('.overlay');
            if (infoPanel) infoPanel.classList.remove('active');
            if (layerPanel) layerPanel.classList.remove('active');
            if (searchPanel) searchPanel.classList.remove('active');
            if (createPanel) createPanel.classList.remove('active');
            if (createFollow) createFollow.classList.remove('active');
            if (createDashboard) createDashboard.classList.remove('active');
            if (createGroupView) createGroupView.classList.remove('active');
            if (createTarget) createTarget.classList.remove('active');
            if (overlay) overlay.classList.remove('active');
            if (typeof groupUpdateInterval !== 'undefined' && groupUpdateInterval) {
                clearInterval(groupUpdateInterval);
                groupUpdateInterval = null;
            }
        }
    </script>

                    const cloud = `<path d="M17.5 19C19.9853 19 22 16.9853 22 14.5C22 12.1325 20.1774 10.2038 17.8595 10.015C17.3888 6.61803 14.4172 4 10.8333 4C6.96734 4 3.83333 7.13401 3.83333 11C3.83333 11.0428 3.83371 11.0854 3.83445 11.1278C1.61114 11.6033 0 13.606 0 16C0 18.7614 2.23858 21 5 21H17.5Z" fill="#b2dcfa"></path>`;

                    else if ([45, 48].includes(code)) { text = "มีหมอก"; iconSVG = `<g transform="translate(0, 2)">${cloud}</g>`; }
                    else if ([51, 53, 55, 61, 63, 65, 80, 81, 82].includes(code)) { text = "ฝนตก"; iconSVG = `<g transform="translate(0, -2)">${cloud}</g>${rain}`; }

                    else { text = "มีเมฆ"; iconSVG = `<g transform="translate(0, 2)">${cloud}</g>`; }
                    return { text: text, svg: `<svg style="width:100%; height:100%; display:block;" viewBox="0 0 24 24">${iconSVG}</svg>` };

                        const [omRes, marineRes] = await Promise.all([fetch(omUrl), fetch(marineUrl)]);

                        let marineData = null;

                    }

                $(document).ready(function () {
                    const dateInput = document.getElementById('weather-date');
                    const today = new Date();
                    const localDate = new Date(today.getTime() - today.getTimezoneOffset() * 60000).toISOString().split('T')[0];
                    dateInput.value = localDate;
                    const lat = document.getElementById('latitude').value;
                    const lng = document.getElementById('longitude').value;
                    if (lat && lng) loadData(lat, lng);
                    dateInput.addEventListener('change', () => {
                        const currentLat = document.getElementById('latitude').value;
                        const currentLng = document.getElementById('longitude').value;
                        if (currentLat && currentLng) loadData(currentLat, currentLng);
                    });
                    const slider = document.getElementById('ui-hourly-container');
                    let isDown = false; let startX; let scrollLeft;
                    slider.addEventListener('mousedown', (e) => {
                        isDown = true; slider.style.cursor = 'grabbing';
                        startX = e.pageX - slider.offsetLeft; scrollLeft = slider.scrollLeft;
                    });
                    slider.addEventListener('mouseleave', () => { isDown = false; slider.style.cursor = 'grab'; });
                    slider.addEventListener('mouseup', () => { isDown = false; slider.style.cursor = 'grab'; });
                    slider.addEventListener('mousemove', (e) => {
                        if (!isDown) return;
                        e.preventDefault();
                        const x = e.pageX - slider.offsetLeft;
                        const walk = (x - startX) * 1.5;
                        slider.scrollLeft = scrollLeft - walk;
                    });
                });
            </script>

            <script>
                let authData = { userId: "mobile", name: "", number: "" };
                if (window.Android) {

                        if (typeof window.Android.getUserName === 'function') authData.name = window.Android.getUserName() || "";

                    btn.innerText = "❌ Connection Failed";
                    btn.style.backgroundColor = "#6c757d";
                    btn.disabled = true;
                });
                let mainPeerConnection;
                let localStream = null;
                let peerConnections = {}; // Map of adminId -> RTCPeerConnection for outgoing stream
                let broadcastPeers = {};  // Map of adminId -> RTCPeerConnection for incoming broadcast
                setInterval(() => {
                    if (localStream && socket && socket.connected) {
                        socket.emit('signal', {
                            to: 'admin',
                            signal: { type: 'presence' },

                            shipNumber: authData.number,
                            senderName: authData.name

                }, 5000);
                const config = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
                function cleanupPeer(senderId) {
                    if (broadcastPeers[senderId]) {

                        delete broadcastPeers[senderId];
                        if (Object.keys(broadcastPeers).length === 0) showBroadcastBanner(false);
                    }
                    if (peerConnections[senderId]) {
                        try { peerConnections[senderId].close(); } catch (e) { }
                        delete peerConnections[senderId];
                    }
                }
                socket.on('signal', async (data) => {
                    const senderId = data.from;
                    if (data.signal.type === 'discover') {

                            try {
                                const pc = new RTCPeerConnection(config);
                                peerConnections[senderId] = pc;
                                pc.oniceconnectionstatechange = () => {
                                    const state = pc.iceConnectionState;
                                    if (state === 'disconnected' || state === 'failed' || state === 'closed') {
                                        cleanupPeer(senderId);
                                    }

                                        pc._broadcastAudio = new Audio();
                                        pc._broadcastAudio.srcObject = event.streams[0];
                                        pc._broadcastAudio.play().catch(e => console.warn("Auto-play blocked", e));
                                        showBroadcastBanner(true);
                                    }
                                };
                                localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
                                pc.onicecandidate = (event) => {
                                    if (event.candidate) {
                                        socket.emit('signal', { to: senderId, signal: event.candidate });
                                    }
                                };
                                const offer = await pc.createOffer();
                                await pc.setLocalDescription(offer);
                                socket.emit('signal', {
                                    to: senderId,
                                    signal: offer,
                                    shipName: authData.name,
                                    shipNumber: authData.number,
                                    senderName: authData.name
                                });
                            } catch (e) {
                                console.error("Error responding to discover:", e);
                            }
                        }
                        return;
                    }
                    if (data.signal.type === 'broadcast_stopped') {
                        for (let id in broadcastPeers) {
                            try { broadcastPeers[id].close(); } catch (e) { }
                            delete broadcastPeers[id];
                        }
                        const pcs = [mainPeerConnection, ...Object.values(peerConnections)];
                        pcs.forEach(pc => {
                            if (pc && pc._broadcastAudio) {
                                pc._broadcastAudio.pause();
                                pc._broadcastAudio.srcObject = null;
                                delete pc._broadcastAudio;
                            }
                        });
                        showBroadcastBanner(false);
                        return;
                    }
                    if (data.signal.type === 'disconnect') {
                        cleanupPeer(senderId);
                        return;
                    }
                    if (data.signal.type === 'offer') {
                        let pc = peerConnections[senderId] || (senderId === 'admin' ? mainPeerConnection : null);
                        if (pc && pc.signalingState !== 'closed') {
                            try {
                                await pc.setRemoteDescription(data.signal);
                                const answer = await pc.createAnswer();
                                await pc.setLocalDescription(answer);
                                socket.emit('signal', { to: senderId, isBroadcast: data.isBroadcast, signal: answer });
                                return;
                            } catch (e) {
                                console.error("Error handling re-negotiation offer:", e);
                            }
                        }
                        if (data.isBroadcast) {
                            try {
                                const pc = new RTCPeerConnection(config);
                                broadcastPeers[senderId] = pc;
                                pc.oniceconnectionstatechange = () => {
                                    const state = pc.iceConnectionState;
                                    if (state === 'disconnected' || state === 'failed' || state === 'closed') {
                                        cleanupPeer(senderId);
                                    }
                                };
                                pc.ontrack = (event) => {
                                    if (!pc._broadcastAudio) {
                                        pc._broadcastAudio = new Audio();
                                        pc._broadcastAudio.srcObject = event.streams[0];
                                        pc._broadcastAudio.play().catch(e => console.warn("Auto-play blocked", e));
                                        showBroadcastBanner(true);
                                    }
                                };
                                pc.onicecandidate = (event) => {
                                    if (event.candidate) {
                                        socket.emit('signal', { to: senderId, isBroadcast: true, signal: event.candidate });
                                    }
                                };
                                await pc.setRemoteDescription(data.signal);
                                const answer = await pc.createAnswer();
                                await pc.setLocalDescription(answer);
                                socket.emit('signal', { to: senderId, isBroadcast: true, signal: answer });
                            } catch (err) {
                                console.error("Error receiving broadcast:", err);
                            }
                        }
                        return;
                    }

                        if (mainPeerConnection && !mainPeerConnection.remoteDescription) {
                            await mainPeerConnection.setRemoteDescription(data.signal);
                            peerConnections[senderId] = mainPeerConnection;
                            mainPeerConnection.oniceconnectionstatechange = () => {
                                const state = mainPeerConnection.iceConnectionState;
                                if (state === 'disconnected' || state === 'failed' || state === 'closed') {
                                    cleanupPeer(senderId);
                                }
                            };
                        } else if (!peerConnections[senderId]) {
                            try {
                                const pc = new RTCPeerConnection(config);
                                peerConnections[senderId] = pc;
                                pc.oniceconnectionstatechange = () => {
                                    const state = pc.iceConnectionState;
                                    if (state === 'disconnected' || state === 'failed' || state === 'closed') {
                                        cleanupPeer(senderId);

                                    }

                                }

                                    if (event.candidate) {

                                    }

                                console.error("Error adding ICE candidate:", e);
                            }
                        }
                    }

                        stream.getTracks().forEach(track => mainPeerConnection.addTrack(track, stream));
                        mainPeerConnection.onicecandidate = (event) => {
                            if (event.candidate) {
                                socket.emit('signal', { to: 'admin', signal: event.candidate });

                        };
                        const offer = await mainPeerConnection.createOffer();

                            shipName: authData.name,

                    if (window.Android && typeof window.Android.stopWebRTC === 'function') {
                        window.Android.stopWebRTC();
                    }
                    doStopStreaming();
                });
                window.doStopStreaming = function () {
                    socket.emit('signal', { to: 'admin', signal: { type: 'disconnect' } });

                        localStream.getTracks().forEach(track => track.stop());
                        localStream = null;
                    }
                    const videoElement = document.getElementById('localVideo');
                    if (videoElement) {
                        videoElement.srcObject = null;
                        videoElement.style.display = 'none';
                    }
                    if (mainPeerConnection) {
                        mainPeerConnection.close();
                        mainPeerConnection = null;
                    }
                    for (let id in peerConnections) {
                        peerConnections[id].close();
                    }
                    peerConnections = {};
                    document.getElementById('disconnectBtn').style.display = 'none';
                    document.getElementById('transmitBtn').style.display = 'inline-block';

                window.scheduleIceRestart = function () {
                    if (peerConnection && peerConnection.iceConnectionState !== 'closed') {

                                    shipNumber: authData.number,
                                    senderName: authData.name

            <script>
                const thaiMonthsMap = { "ม.ค.": "01", "ก.พ.": "02", "มี.ค.": "03", "เม.ย.": "04", "พ.ค.": "05", "มิ.ย.": "06", "ก.ค.": "07", "ส.ค.": "08", "ก.ย.": "09", "ต.ค.": "10", "พ.ย.": "11", "ธ.ค.": "12" };
                function parseThaiTextToISO(text) {
                    const regex = /.*?\s*(\d{1,2})\s*([ก-๙\.]+)\s*(\d{4})\s*เวลา\s*(\d{1,2})[:\.](\d{2})/;
                    const match = text.match(regex);
                    if (match) {
                        let [, day, monthThai, yearThai, hour, minute] = match;
                        monthThai = monthThai.trim();
                        let month = thaiMonthsMap[monthThai];
                        if (!month) return null;
                        let year = parseInt(yearThai, 10) - 543;
                        day = day.padStart(2, '0');
                        hour = hour.padStart(2, '0');
                        return `${year}-${month}-${day}T${hour}:${minute}`;
                    }
                    return null;
                }
                function updateSaveButtonState() {
                    const allDisplayInputs = document.querySelectorAll('.custom-datetime-display');
                    const saveBtn = document.getElementById('save-btn');
                    let isAllValid = true;
                    allDisplayInputs.forEach(input => {
                        const hiddenInputId = input.id.replace('display-', 'hidden-');
                        const hiddenInput = document.getElementById(hiddenInputId);
                        if (hiddenInput && hiddenInput.value === "") {
                            isAllValid = false;
                        }
                    });
                    if (saveBtn) {
                        if (!isAllValid) {
                            saveBtn.style.pointerEvents = "none";
                            saveBtn.style.opacity = "0.4";
                        } else {
                            saveBtn.style.pointerEvents = "auto";
                            saveBtn.style.opacity = "1";
                        }
                    }
                    return isAllValid;
                }
                function updateSpeedForPoint(targetPoint) {
                    if (targetPoint <= 1) return;
                    const outInput = document.getElementById('hidden-out-point' + (targetPoint - 1));
                    const inInput = document.getElementById('hidden-in-point' + targetPoint);
                    const speedInput = document.getElementById('speed' + targetPoint);
                    if (outInput && inInput && speedInput && routePointsCoords[targetPoint - 1] && routePointsCoords[targetPoint]) {
                        const outTimeStr = outInput.value;
                        const inTimeStr = inInput.value;
                        if (outTimeStr && inTimeStr) {
                            const outTime = new Date(outTimeStr);
                            const inTime = new Date(inTimeStr);
                            const diffHours = (inTime - outTime) / (1000 * 60 * 60);
                            if (diffHours > 0) {
                                const p1 = L.latLng(routePointsCoords[targetPoint - 1].lat, routePointsCoords[targetPoint - 1].lng);
                                const p2 = L.latLng(routePointsCoords[targetPoint].lat, routePointsCoords[targetPoint].lng);
                                const distanceNM = p1.distanceTo(p2) / 1852;
                                const speedValue = (distanceNM / diffHours).toFixed(2);
                                speedInput.value = speedValue + " ไมล์ทะเลต่อชั่วโมง";
                            } else {
                                speedInput.value = "เวลาไม่สอดคล้องกัน";
                            }
                        } else {
                            speedInput.value = "";
                        }
                    }
                }
                document.addEventListener('input', function (event) {
                    if (event.target.classList.contains('custom-datetime-display')) {
                        const displayInput = event.target;

                            displayInput.value = userInput;
                        }
                        if (event.inputType && !event.inputType.includes('delete')) {
                            if (/(เวลา\s+\d{2})$/.test(userInput)) {
                                userInput += ':';
                                displayInput.value = userInput;
                            }
                        }
                        const isoValue = parseThaiTextToISO(userInput);
                        const hiddenInputId = displayInput.id.replace('display-', 'hidden-');
                        const hiddenInput = document.getElementById(hiddenInputId);
                        if (hiddenInput) {
                            if (isoValue) {
                                hiddenInput.value = isoValue;
                                displayInput.style.border = "1px solid green";
                            } else {
                                hiddenInput.value = "";
                                displayInput.style.border = "1px solid red";
                            }
                            const matchIn = hiddenInput.id.match(/hidden-in-point(\d+)/);
                            if (matchIn) {
                                const pointNum = parseInt(matchIn[1], 10);
                                updateSpeedForPoint(pointNum);
                            }
                            const matchOut = hiddenInput.id.match(/hidden-out-point(\d+)/);
                            if (matchOut) {
                                const pointNum = parseInt(matchOut[1], 10);
                                updateSpeedForPoint(pointNum + 1);
                            }
                        }
                        updateSaveButtonState();
                    }
                });
                document.addEventListener("DOMContentLoaded", () => {
                    const name = Android.getName();
                    document.getElementById("name").value = name;
                });
            </script>

    <script>
        var SeaCoastStyle = {
            color: '#ffff00',
            weight: 1,
            fillColor: '#ffff00',
            opacity: 1,
            fillOpacity: 0.2
        };
        var ExclusiveEconomicZonesStyle = {
            color: '#55aaff',
            weight: 1,
            fillColor: '#55aaff',
            opacity: 1,
            fillOpacity: 0.2
        };
        var ContiguousZoneStyle = {
            color: '#00aaff',
            weight: 1,
            fillColor: '#00aaff',
            opacity: 1,
            fillOpacity: 0.2
        };
        var TerritorialWatersStyle = {
            color: '#aaffff',
            weight: 1,
            fillColor: '#aaffff',
            opacity: 1,
            fillOpacity: 0.2
        };
        var InternalWatersStyle = {
            color: 'transparent',
            weight: 1,
            fillColor: '#ffffff',
            opacity: 1,
            fillOpacity: 0.2
        };
        var ProvinceAreaStyle = {
            color: '#000000',
            weight: 1,
            fillOpacity: 0
        };
        var allCoastalCurrentsLayer = L.layerGroup();
        async function loadCoastalCurrents() {
            const layers = ['recent_gulf', 'v_recent_gul5', 'v_recent_gul6', 'recent_gul3', 'recent_gul4', 'v_recent_gul7'];
            const baseUrl = 'https://ocean.gistda.or.th/geoserver/coastalradar/ows?service=WFS&version=1.0.0&request=GetFeature&outputFormat=application%2Fjson&typeName=coastalradar:';
            function getVelocityColor(v) {
                if (v >= 85) return '#ff0000';
                if (v >= 80) return '#fb6a47';
                if (v >= 75) return '#fb9d47';
                if (v >= 70) return '#facd48';
                if (v >= 65) return '#faff4b';
                if (v >= 60) return '#e3ff47';
                if (v >= 55) return '#cbff49';
                if (v >= 50) return '#93fe44';
                if (v >= 45) return '#46fe43';
                if (v >= 40) return '#4cfd99';
                if (v >= 35) return '#53fdcd';
                if (v >= 30) return '#55fde6';
                if (v >= 25) return '#57fdfe';
                if (v >= 20) return '#57ccfe';
                if (v >= 15) return '#579afe';
                if (v >= 10) return '#576efe';
                return '#5853ff';
            }
            function createArrowIcon(feature) {
                var v = feature.properties.velocity || 0;
                var dir = feature.properties.direction || 0;
                var color = getVelocityColor(v);
                var html = `<div style="transform: rotate(${dir}deg); transform-origin: center; width: 14px; height: 14px; display: flex; align-items: center; justify-content: center;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2L12 22M12 2L5 9M12 2L19 9" stroke="${color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>`;
                return L.divIcon({ html: html, className: '', iconSize: [14, 14], iconAnchor: [7, 7] });
            }
            function renderFeatures(features) {
                var layer = L.geoJSON(features, {
                    pointToLayer: function (feature, latlng) {
                        return L.marker(latlng, { icon: createArrowIcon(feature) });
                    },
                    onEachFeature: function (feature, layer) {
                        if (feature.properties) {
                            var v = feature.properties.velocity ? feature.properties.velocity.toFixed(2) : '-';
                            var d = feature.properties.direction ? feature.properties.direction.toFixed(2) : '-';
                        }
                    }
                });
                allCoastalCurrentsLayer.clearLayers();
                allCoastalCurrentsLayer.addLayer(layer);
            }
            try {
                let allFeatures = [];
                const fetchPromises = layers.map(layer => fetch(baseUrl + layer).then(res => res.json()));
                const results = await Promise.all(fetchPromises);
                results.forEach(res => {
                    if (res && res.features) allFeatures = allFeatures.concat(res.features);
                });
                if (allFeatures.length > 0) {
                    renderFeatures(allFeatures);
                    try { localStorage.setItem('cached_currents', JSON.stringify(allFeatures)); } catch (e) { }
                }
            } catch (e) {
                let cached = localStorage.getItem('cached_currents');
                if (cached) {
                    try { renderFeatures(JSON.parse(cached)); return; } catch (ex) { }
                }
                fetch('dist/COASTAL_RADAR_CURRENTS.json')
                    .then(res => res.json())
                    .then(data => { if (data && data.features) renderFeatures(data.features); })
                    .catch(err => console.log("Failed to load bundled currents: ", err));
            }
        }
        loadCoastalCurrents();
        setInterval(loadCoastalCurrents, 3600000);
        var aisWMSUrl = "https://ocean.gistda.or.th/geoserver/ais/wms";
        var aisLayerName = "view_vessel_latest_gportal";
        var aisLayer = L.tileLayer.wms(aisWMSUrl, {
            layers: aisLayerName,
            format: 'image/png',
            transparent: true,
            version: '1.1.0',
            cache_buster: Date.now() // Force fresh data on initial load
        });
        setInterval(function () {
            if (map.hasLayer(aisLayer)) {
                aisLayer.setParams({
                    cache_buster: Date.now()
                });
            }
        }, 60000);
        const SeaCoast = L.geoJSON(seacoast, { style: SeaCoastStyle });
        const ExclusiveEconomicZones = L.geoJSON(exclusiveeconomiczones, { style: ExclusiveEconomicZonesStyle });
        const ContiguousZone = L.geoJSON(contiguouszone, { style: ContiguousZoneStyle });
        const TerritorialWaters = L.geoJSON(territorialwaters, { style: TerritorialWatersStyle });
        const InternalWaters = L.geoJSON(internalwaters, { style: InternalWatersStyle });
        const ProvinceArea = L.geoJSON(provincezone, { style: ProvinceAreaStyle });
        const SeaLevelContourGroup = L.layerGroup();
        const depthConfig = [
            { id: '0 m', name: '&nbsp;&nbsp;0', color: '#e1e6ec' },
            { id: '5 m', name: '&nbsp;&nbsp;5', color: '#cae0f5' },
            { id: '10 m', name: '10', color: '#c2dbef' },
            { id: '15 m', name: '15', color: '#9cc8ed' },
            { id: '20 m', name: '20', color: '#7bb3e2' },
            { id: '25 m', name: '25', color: '#6dabdc' },
            { id: '30 m', name: '30', color: '#5c9cda' },
            { id: '35 m', name: '35', color: '#4d81cc' },
            { id: '40 m', name: '40', color: '#4460b3' },
            { id: '45 m', name: '45', color: '#2a3d8a' },
            { id: '50 m', name: '50', color: '#202978' }
        ];
        const contourDepthLabelGroup = L.layerGroup();
        contourDepthLabelGroup.addTo(SeaLevelContourGroup);
        function updateContourDepthLabels() {
            if (typeof SeaLevelContourGroup === 'undefined' || typeof map === 'undefined' || !map.hasLayer(SeaLevelContourGroup)) {
                if (typeof contourDepthLabelGroup !== 'undefined') {
                    contourDepthLabelGroup.clearLayers();
                }
                return;
            }
            if (typeof contourDepthLabelGroup === 'undefined') return;
            contourDepthLabelGroup.clearLayers();
            var currentZoom = map.getZoom();
            if (currentZoom < 8) return;
            if (typeof contour0m === 'undefined' || !contour0m.features) return;
            var bounds = map.getBounds().pad(0.05);
            var bMinLat = bounds.getSouth();
            var bMaxLat = bounds.getNorth();
            var bMinLng = bounds.getWest();
            var bMaxLng = bounds.getEast();
            var dLat = bMaxLat - bMinLat;
            var dLng = bMaxLng - bMinLng;
            var scanlineCount = currentZoom >= 15 ? 12 : (currentZoom >= 13 ? 9 : (currentZoom >= 11 ? 6 : 4));
            var scanlines = [];
            for (var k = 1; k <= scanlineCount; k++) {
                var scanLat = bMinLat + (k / (scanlineCount + 1)) * dLat;
                var p1 = [bMinLng - dLng * 0.1, scanLat];
                var p2 = [bMaxLng + dLng * 0.1, scanLat];
                var trLine = (typeof turf !== 'undefined' && typeof turf.lineString === 'function')
                    ? turf.lineString([p1, p2])
                    : { geometry: { coordinates: [p1, p2] } };
                scanlines.push({
                    lat: scanLat,
                    p1: p1,
                    p2: p2,
                    line: trLine,
                    markers: []
                });
            }
            contour0m.features.forEach(function (f) {
                var rawName = (f.properties && f.properties.name) ? f.properties.name : '';
                var num = parseFloat(rawName);
                if (isNaN(num)) return;
                var labelText = '-' + Math.abs(num).toFixed(1);
                var geoms = f.geometry ? (f.geometry.type === 'GeometryCollection' ? f.geometry.geometries : [f.geometry]) : [];
                geoms.forEach(function (g) {
                    var lines = g.type === 'MultiLineString' ? g.coordinates : (g.type === 'LineString' ? [g.coordinates] : []);
                    lines.forEach(function (pts) {

                                    if (!window.simEvasiveLine) {
                                        window.simEvasiveLine = L.polyline([], { color: '#ff0000', weight: 3, dashArray: '5, 10' }).addTo(map);
                                    }
                                    window.simEvasiveLine.setLatLngs([patrolLL, safeEndpoint]);
                                    if (!map.hasLayer(window.simEvasiveLine)) {
                                        window.simEvasiveLine.addTo(map);
                                    }
                                }
                                currentHeadingInput = newHeading;
                                $('#follow-heading').val(newHeading.toFixed(1));
                            }
                        }
                    } else if (window.activeSearchTrack && window.activeSearchTrack.name && window.activeSearchTrack.session && window.activeSearchTrack.session.lastLatLng) {
                        const targetLL = window.activeSearchTrack.session.lastLatLng;
                        const patrolLL = L.latLng(data.lat, data.lng);
                        const dist = patrolLL.distanceTo(targetLL);
                        if (!window.simTrackingLine) {
                            window.simTrackingLine = L.polyline([], { color: 'transparent', weight: 3, dashArray: '5, 10' }).addTo(map);
                        }
                        window.simTrackingLine.setLatLngs([patrolLL, targetLL]);
                        if (!map.hasLayer(window.simTrackingLine)) {
                            window.simTrackingLine.addTo(map);
                        }
                        const targetReachThreshold = 5; // Stop right next to target boat (meters)
                        if (dist <= targetReachThreshold) {
                            currentSpeedInput = 0;
                            data.speed = 0;
                            $('#follow-speed').val("0");
                            if (window.simEvasiveLine && map.hasLayer(window.simEvasiveLine)) {
                                map.removeLayer(window.simEvasiveLine);
                            }
                            if (window.boatingControl && window.boatingControl.legend && window.boatingControl.legend.obstacleWarningContainer) {
                                window.boatingControl.legend.obstacleWarningContainer.style.display = 'none';
                            }
                            $('#evasive-warning').remove();
                            for (let tid in window.activeTargets) {
                                if (window.activeTargets[tid].data && window.activeSearchTrack && window.activeTargets[tid].data.name === window.activeSearchTrack.name) {
                                    window.activeTargets[tid].data.isStopped = true;
                                    window.activeTargets[tid].data.speed = 0;
                                }
                            }
                        } else if (dist > targetReachThreshold && (!isNaN(currentSpeedInput) ? currentSpeedInput : data.speed) > 0) {
                            const lat1 = data.lat * Math.PI / 180;
                            const lon1 = data.lng * Math.PI / 180;
                            const lat2 = targetLL.lat * Math.PI / 180;
                            const lon2 = targetLL.lng * Math.PI / 180;
                            const y = Math.sin(lon2 - lon1) * Math.cos(lat2);
                            const x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(lon2 - lon1);
                            const brng = Math.atan2(y, x) * 180 / Math.PI;
                            let newHeading = (brng + 360) % 360;
                            if (window.calculateEvasiveHeading) {
                                let evasiveResult = window.calculateEvasiveHeading(data.lat, data.lng, newHeading, (!isNaN(currentSpeedInput) ? currentSpeedInput : data.speed), data.heading, dist);
                                newHeading = evasiveResult.heading;
                                let safeEndpoint = targetLL;
                                if (evasiveResult.isEvasive) {
                                    const targetDist = Math.min(dist, 2000);
                                    const R_m = 6371e3;
                                    const evBrng = evasiveResult.heading * Math.PI / 180;
                                    const lat1_m = data.lat * Math.PI / 180;
                                    const lon1_m = data.lng * Math.PI / 180;
                                    let lat2_m = Math.asin(Math.sin(lat1_m) * Math.cos(targetDist / R_m) + Math.cos(lat1_m) * Math.sin(targetDist / R_m) * Math.cos(evBrng));
                                    let lon2_m = lon1_m + Math.atan2(Math.sin(evBrng) * Math.sin(targetDist / R_m) * Math.cos(lat1_m), Math.cos(targetDist / R_m) - Math.sin(lat1_m) * Math.sin(lat2_m));
                                    safeEndpoint = L.latLng(lat2_m * 180 / Math.PI, lon2_m * 180 / Math.PI);
                                    if (window.boatingControl && window.boatingControl.legend && window.boatingControl.legend.obstacleWarningContainer) {
                                        window.boatingControl.legend.obstacleWarningContainer.style.display = 'block';
                                        if (window.boatingControl.legend.obstacleDist) {
                                            window.boatingControl.legend.obstacleDist.innerText = evasiveResult.nmDist;
                                        }
                                    }
                                } else {
                                    if (window.boatingControl && window.boatingControl.legend && window.boatingControl.legend.obstacleWarningContainer) {
                                        window.boatingControl.legend.obstacleWarningContainer.style.display = 'none';
                                    }
                                    $('#evasive-warning').remove();
                                }
                                if (!window.simEvasiveLine) {
                                    window.simEvasiveLine = L.polyline([], { color: '#ff0000', weight: 3, dashArray: '5, 10' }).addTo(map);
                                }
                                window.simEvasiveLine.setLatLngs([patrolLL, safeEndpoint]);
                                if (!map.hasLayer(window.simEvasiveLine)) {
                                    window.simEvasiveLine.addTo(map);
                                }
                            }
                            currentHeadingInput = newHeading;
                            $('#follow-heading').val(newHeading.toFixed(1));
                        }
                    }
                    const currentDistance = (!isNaN(currentSpeedInput) ? currentSpeedInput : data.speed) * 0.514444; // m/s
                    data.speed = !isNaN(currentSpeedInput) ? currentSpeedInput : data.speed;
                    data.heading = !isNaN(currentHeadingInput) ? currentHeadingInput : data.heading;
                    const distTravelledMeters = currentDistance * (deltaMs / 1000);
                    data.distance += (distTravelledMeters / 1852); // convert to NM
                    const d = currentDistance / R;
                    const brng = data.heading * Math.PI / 180;
                    const lat1 = data.lat * Math.PI / 180;
                    const lon1 = data.lng * Math.PI / 180;
                    let lat2 = Math.asin(Math.sin(lat1) * Math.cos(d) + Math.cos(lat1) * Math.sin(d) * Math.cos(brng));
                    let lon2 = lon1 + Math.atan2(Math.sin(brng) * Math.sin(d) * Math.cos(lat1), Math.cos(d) - Math.sin(lat1) * Math.sin(lat2));
                    data.lat = lat2 * 180 / Math.PI;
                    data.lng = lon2 * 180 / Math.PI;
                    $('#follow-latitude').val(data.lat.toFixed(6));
                    $('#follow-longitude').val(data.lng.toFixed(6));
                    $('#follow-dist-sim').text(data.distance.toFixed(2));
                    $('#follow-time-sim').text(data.elapsedTime.toFixed(1));
                    $('#follow-speed-sim').text(data.speed);
                    window.savePersistedBoats();
                    if (window.boatingControl) {
                        window.boatingControl.onLocationFound({
                            latlng: L.latLng(data.lat, data.lng),
                            accuracy: 10,
                            heading: data.heading,
                            speed: currentDistance,
                            isSimulated: true
                        });
                    }
                    if (window.simTrackingLine && map.hasLayer(window.simTrackingLine)) {
                        let currentPoints = window.simTrackingLine.getLatLngs();
                        if (currentPoints && currentPoints.length > 1) {
                            window.simTrackingLine.setLatLngs([L.latLng(data.lat, data.lng), currentPoints[currentPoints.length - 1]]);
                        }
                    }
                    if (window.simEvasiveLine && map.hasLayer(window.simEvasiveLine)) {
                        let currentPoints = window.simEvasiveLine.getLatLngs();
                        if (currentPoints && currentPoints.length > 1) {
                            window.simEvasiveLine.setLatLngs([L.latLng(data.lat, data.lng), currentPoints[currentPoints.length - 1]]);
                        }
                    }
                    if (window.Android && typeof window.Android.updateSimulatedLocation === 'function') {
                        window.Android.updateSimulatedLocation(data.lat, data.lng, data.heading, currentDistance);
                    }
                }, 1000);
            }
            window.followSimulation = { interval: interval, data: data };
            $('#boat-follow-list').empty().append(window.createBoatListItem('follow', 'sim', data));
        };
        window.followSave = function (event) {
            event.preventDefault();
            const name = $('#follow-name').val() || "เรือตรวจการณ์";
            let lat = parseFloat($('#follow-latitude').val());
            let lng = parseFloat($('#follow-longitude').val());
            const speed = parseFloat($('#follow-speed').val());
            const heading = parseFloat($('#follow-heading').val());
            if (isNaN(lat) || isNaN(lng) || isNaN(speed) || isNaN(heading)) {
                alert('Please enter valid numbers for Lat, Lng, Speed, and Heading.');
                return;
            }
            if (window.followSimulation && window.followSimulation.interval) {
                clearInterval(window.followSimulation.interval);
            }
            if (window.Android && typeof window.Android.setSimulationMode === 'function') {
                window.Android.setSimulationMode(true);
            }
            const data = {
                name: name,
                lat: lat,
                lng: lng,
                speed: speed,
                heading: heading,
                distance: 0,
                elapsedTime: 0,
                startTime: Date.now(),
                isPaused: false,
                isStopped: false
            };
            window.renderFollowBoat(data);
            window.savePersistedBoats();
            if (typeof closeAllPanels === 'function') {
                closeAllPanels();
            }
            const searchPanel = document.querySelector('.search-panel');
            if (searchPanel) searchPanel.classList.remove('active');
            const searchIconFollow = document.querySelector('.search-panel-btn');
            if (searchIconFollow) searchIconFollow.classList.remove('active');
            map.setView([lat, lng], 16);
        };
        window.loadPersistedBoats = function () {
            try {
                const pTargetsStr = localStorage.getItem('persistedTargets');
                if (pTargetsStr) {
                    const pTargets = JSON.parse(pTargetsStr);
                    for (const id in pTargets) {
                        window.renderTargetBoat(id, pTargets[id]);
                    }
                }
                const pFollowsStr = localStorage.getItem('persistedFollows');
                if (pFollowsStr) {
                    const pFollows = JSON.parse(pFollowsStr);
                    if (pFollows['sim']) {
                        window.renderFollowBoat(pFollows['sim']);
                    }
                }
            } catch (e) {
                console.error("Error loading persisted boats", e);
            }
        };
        setTimeout(window.loadPersistedBoats, 1500);
        window._lastLiveServerLocationTimestamp = 0;
        window._lastLiveInactiveLocationTimestamp = 0;
        if (typeof window.receiveServerLocation === 'function') {
            const originalReceiveServerLocation = window.receiveServerLocation;
            window.receiveServerLocation = function (UserId, Number, Name, Type, UnitName, lat, lng, bearing, speed, isFallback = false) {
                if (!isFallback) {
                    window._lastLiveServerLocationTimestamp = Date.now();
                }
                originalReceiveServerLocation(UserId, Number, Name, Type, UnitName, lat, lng, bearing, speed);
            };
        }
        if (typeof window.receiveInactiveLocation === 'function') {
            const originalReceiveInactiveLocation = window.receiveInactiveLocation;
            window.receiveInactiveLocation = function (name, number, lat, lng, isFallback = false) {
                if (!isFallback) {
                    window._lastLiveInactiveLocationTimestamp = Date.now();
                }
                originalReceiveInactiveLocation(name, number, lat, lng);
            };
        }
        window.fetchOnlineBoatsFallback = function () {
            if (Date.now() - (window._lastLiveServerLocationTimestamp || 0) < 6000) {
                return;
            }
            const fleetUrl = 'location.json?t=' + new Date().getTime();
            fetch(fleetUrl)
                .then(response => {
                    if (!response.ok) throw new Error('Network response was not ok');
                    return response.json();
                })
                .then(data => {
                    if (Array.isArray(data)) {
                        data.forEach(ship => {
                            const lat = parseFloat(ship.lat);
                            const lng = parseFloat(ship.lng);
                            if (isNaN(lat) || isNaN(lng) || (lat === 0 && lng === 0)) return;
                            if (typeof window.receiveServerLocation === 'function') {
                                window.receiveServerLocation(
                                    ship.UserId || "",
                                    ship.Number || "",
                                    ship.Name || "",
                                    ship.Type || "",
                                    ship.UnitName || "",
                                    lat,
                                    lng,
                                    parseFloat(ship.bearing) || 0,
                                    parseFloat(ship.speed) || 0,
                                    true
                                );
                            } else if (window.boatingControl && typeof window.boatingControl.updatePeer === 'function') {
                                const locationEvent = {
                                    latlng: L.latLng(lat, lng),
                                    accuracy: 10,
                                    heading: parseFloat(ship.bearing) || 0,
                                    speed: parseFloat(ship.speed) || 0
                                };
                                window.boatingControl.updatePeer(ship.UserId || "Me", ship.Number, ship.Name, ship.Type, ship.UnitName, locationEvent);
                            }
                        });
                    }
                })
                .catch(err => console.error('Error fetching online boats fallback (location.json):', err));
        };
        window.fetchOfflineBoatsFallback = function () {
            if (Date.now() - (window._lastLiveInactiveLocationTimestamp || 0) < 6000) {
                return;
            }
            const offlineUrl = 'geolocation.json?t=' + new Date().getTime();
            fetch(offlineUrl)
                .then(response => {
                    if (!response.ok) throw new Error('Network response was not ok');
                    return response.json();
                })
                .then(data => {
                    if (data && data.features && Array.isArray(data.features)) {
                        data.features.forEach(feature => {
                            if (!feature.properties || !feature.geometry || !feature.geometry.coordinates) return;
                            const coords = feature.geometry.coordinates;
                            const lng = parseFloat(coords[0]);
                            const lat = parseFloat(coords[1]);
                            if (isNaN(lat) || isNaN(lng) || (lat === 0 && lng === 0)) return;
                            if (typeof window.receiveInactiveLocation === 'function') {
                                window.receiveInactiveLocation(
                                    feature.properties.name || "",
                                    feature.properties.number || "",
                                    lat,
                                    lng,
                                    true
                                );
                            }
                        });
                    }
                })
                .catch(err => console.error('Error fetching offline boats fallback (geolocation.json):', err));
        };
        setTimeout(() => {
            window.fetchOnlineBoatsFallback();
            window.fetchOfflineBoatsFallback();
            setInterval(() => {
                window.fetchOnlineBoatsFallback();
                window.fetchOfflineBoatsFallback();
            }, 5000);
        }, 2000);
    </script>
